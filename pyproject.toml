[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mikebd-py-scripts"
version = "0.1.2"
description = "A collection of Python scripts"
authors = [
    { name = "Michael Ben-David" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "shtab>=1.11.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
ai-agent-launcher = "ai_agent_launcher.cli:main"
brew_diff = "brew.diff:diff"
bu = "brew.update:update"
codex_fix = "jetbrains.codex_fix:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.0.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.10",
]

[tool.coverage.run]
omit = ["*/__init__.py"]

# Pyright Configuration: https://microsoft.github.io/pyright/#/configuration
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

reportDeprecated = true
reportImplicitOverride = true
reportMissingTypeStubs = true
reportPrivateUsage = true
reportUnknownArgumentType = true
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnnecessaryCast = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnusedImport = true
reportUnusedVariable = true

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
# Minimum coverage: --cov-fail-under=70
addopts = "--cov=src --cov-report=term-missing -ra --randomly-seed=last --strict-config --strict-markers"
testpaths = ["tests"]
timeout = 10 # seconds
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "TID", # tidy imports (type-aware, low noise)
]

ignore = [
    "ANN", # let Pyright handle typing
    "TCH", # typing-only imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B008", # function calls in defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
managed = true
